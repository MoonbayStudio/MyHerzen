[package]
name = "myherzen-desktop"
version = "1.0.7"
description = "Мой Герцена для Windows и Linux"
authors = ["Moonbay Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "myherzen_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
