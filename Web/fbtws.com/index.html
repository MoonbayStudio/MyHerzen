<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="scripts/style.css">
    <link rel="stylesheet" href="scripts/media.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <title>Forest Between The Worlds</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
  </head>
  <body>
    <section class="homepage">
      <div class="nav">
        <div class="container">
          <img src="images/logo1.png" class="logo" alt="Forest Between The Worlds">
        </div>
      </div>
      <div class="home">
        <div class="container">
          <h1 class="q1"><br><br><br>"Believe</h1>
          <h2 class="q2">and all your dreams</h2>
          <h3 class="q3">come true"</h3>
          <h4 class="q4"> — the Rock giant</h4>
          <div class="nothing"></div>
        </div>
      </div>
    </section>
    <section id="tunnel" class="tunnel">
      <div class="tunnel__player">
        <div class="tunnel__player__container">
          <div class="tunnel__play"><img class="tunnel__playbtn" src="images/play1.png" alt="Play tunnel"></div>
          <div class="tunnel__bar__container">
            <div class="tunnel__bar__container1">
              <div class="tunnel__bar"><img class="tunnel__bar__img" src="images/bar1.png" alt=""></div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section id="giant" class="giant">
      <div class="giant__container hidediv">
        <div class="giant__subcontainer">
          <div class="giant__player">
            <div class="giant__bar">
              <img class="giant__bar__img" src="images/bar1.png" alt="">
              <div class="giant__bar1"><img class="giant__bar__img1" src="images/bar1.png" alt=""></div>
            </div>
            <div class="giant__control"><img class="giant__play" src="images/play1.png" alt="Play"></div>
          </div>
        </div>
      </div>
      <div class="album">
        <div class="allogo">
          <img class="allogoimg" src="images/album.jpg" alt="A song of a rock giant">
          <a class="play" id="play" aria-label="Play A song of a rock giant">
            <img class="playimg" src="images/play1.png" alt="">
          </a>
        </div>
      </div>
      <div class="altext__container">
        <div class="altext">
          <h5 class="aname">A song of a rock giant</h5>
          <h6 class="avai">Available on:</h6>
        </div>
      </div>
    </section>
    <footer class="legal-footer">
      <div class="legal-footer__inner">
        <a class="speedwaycolink" href="https://moonbaystudio.ru">Moonbay Studio</a>
        <div class="legal-footer__links">
          <a href="terms">Условия использования</a>
          <a href="privacy">Политика конфиденциальности</a>
          <a href="cookies">Политика Cookie</a>
          <button type="button" data-cookie-settings>Настройки Cookie</button>
        </div>
        <span>© 2026 Moonbay Studio. Все права защищены.</span>
      </div>
    </footer>
    <audio id="asoarg" src="sounds/asoarg.mp3" type="audio/mpeg"></audio>
    <audio class="tm" src="sounds/tunnel.mp3" type="audio/mpeg"></audio>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.5.1/jquery.min.js"></script>
    <script src="scripts/SlowScroll.js"></script>
    <script src="scripts/videoopener.js"></script>
    <script src="scripts/arrow.js"></script>
    <script src="scripts/legal.js"></script>
  </body>
</html>
